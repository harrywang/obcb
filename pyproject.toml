[project]
name = "obcb"
version = "0.1.0"
description = "Open Business Case Bench - an open, uv-native benchmark pipeline for AI on business case analysis"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Harry Wang" }]
requires-python = ">=3.11"
dependencies = [
    "openai>=1.59.8",
    "pypdf>=5.1.0",
    "pymupdf4llm>=0.0.17",
    "python-dotenv>=1.0.1",
    "click>=8.1.3",
    "rich>=13.9.4",
    "tenacity>=9.0.0",
]

[project.optional-dependencies]
# Local, structure-aware, MIT licensed. Downloads table-structure weights on first run.
docling = ["docling>=2.0.0"]
# Hosted agentic parsers.
llamaparse = ["llama-cloud-services>=0.6.0"]
landingai = ["landingai-ade>=0.1.0"]
all = [
    "docling>=2.0.0",
    "llama-cloud-services>=0.6.0",
    "landingai-ade>=0.1.0",
]

[project.scripts]
obcb = "obcb.cli:cli"

[dependency-groups]
dev = ["ruff>=0.8.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/obcb"]

[tool.ruff]
line-length = 100
